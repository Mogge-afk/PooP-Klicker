<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poop Clicker 💩</title>
<style>
  :root {
    --bg: #1a1208;
    --surface: #2a1e0e;
    --surface2: #3a2a14;
    --border: #5a3e1e;
    --border-warn: #8a6020;
    --border-accent: #6a8020;
    --text: #f0e0b0;
    --text-muted: #907850;
    --text-success: #90d060;
    --text-warn: #e0a030;
    --text-accent: #b0d040;
    --text-danger: #e05030;
    --accent: #4a6010;
    --warn: #4a3008;
    --danger: #4a1808;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 480px;
    padding: 1rem 1rem 0;
    text-align: center;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { color: var(--text-warn); }
  #game {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.75rem 1rem 2rem;
  }
  #score-display {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin: 0.5rem 0 2px;
    letter-spacing: -0.5px;
  }
  #passive-display {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
  }
  #prestige-display {
    font-size: 12px;
    color: var(--text-accent);
    margin-bottom: 0.5rem;
    min-height: 18px;
  }
  #cheat-box {
    width: 100%;
    margin-bottom: 0.5rem;
    padding: 8px 14px;
    border-radius: var(--radius);
    background: var(--danger);
    border: 1px solid var(--text-danger);
    color: var(--text-danger);
    font-size: 13px;
    font-weight: 600;
    display: none;
    text-align: center;
  }
  #poop-btn {
    font-size: 80px;
    background: none;
    border: none;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s;
    margin: 0.5rem 0 1rem;
    line-height: 1;
    padding: 0.5rem;
    border-radius: 50%;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  #poop-btn:active { transform: scale(0.85); }
  #sort-bar {
    width: 100%;
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  #sort-bar button {
    flex: 1;
    padding: 6px 4px;
    font-size: 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s;
  }
  #sort-bar button.active {
    background: var(--accent);
    color: var(--text-accent);
    border-color: var(--border-accent);
  }
  #upgrades {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 1rem;
  }
  .upgrade-btn {
    width: 100%;
    padding: 10px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background 0.12s;
  }
  .upgrade-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .upgrade-btn:not(:disabled):hover { background: var(--surface2); }
  .upg-left { display: flex; flex-direction: column; gap: 2px; }
  .upg-name { font-size: 14px; font-weight: 500; }
  .upg-pps { font-size: 11px; color: var(--text-muted); }
  .upg-right { font-size: 12px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
  .milestone-badge { font-size: 11px; color: var(--text-success); margin-left: 5px; font-weight: 600; }
  .next-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .powerup-btn {
    border-color: var(--border-warn);
    background: var(--warn);
  }
  .powerup-btn:not(:disabled) { color: var(--text-warn); }
  .powerup-btn.used { opacity: 0.35; cursor: not-allowed; }
  #prestige-btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border-accent);
    background: var(--accent);
    color: var(--text-accent);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    margin-bottom: 0.5rem;
    transition: opacity 0.15s;
  }
  #prestige-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #prestige-btn:not(:disabled):hover { opacity: 0.85; }
  .float-score {
    position: fixed;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-success);
    pointer-events: none;
    z-index: 20;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-45px); }
  }
  .skit-splash {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    opacity: 0.85;
    animation: splashIn 0.25s ease-out forwards;
  }
  @keyframes splashIn {
    0% { transform: scale(0.4) rotate(-15deg); opacity: 0.5; }
    100% { transform: scale(1) rotate(8deg); opacity: 0.85; }
  }
</style>
</head>
<body>

<header>
  <h1>Poop <span>Clicker</span> 💩</h1>
</header>

<div id="game">
  <div id="save-status" style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">💾 Sparar automatiskt</div>
  <div id="score-display">0 skitpoäng</div>
  <div id="passive-display">0 sp/sek</div>
  <div id="prestige-display"></div>
  <div id="cheat-box">🚨 Cheat detekterad! Skit sprids...</div>
  <button id="poop-btn" aria-label="Klicka på skithögen">💩</button>

  <div id="sort-bar">
    <button id="sort-default" class="active">Standard</button>
    <button id="sort-price">Billigast först</button>
    <button id="sort-expensive">Dyrast först</button>
  </div>

  <div id="upgrades"></div>

  <button id="prestige-btn" disabled>⭐ Prestige x<span id="prestige-mult">2</span> — kostar 10 000 sp</button>
  <button id="reset-btn" style="margin-top:8px;width:100%;padding:8px;border-radius:var(--radius);border:1px solid var(--border);background:none;color:var(--text-muted);font-size:12px;cursor:pointer;">🗑 Radera sparfil och börja om</button>
</div>

<script>
let score = 0, totalEver = 0, prestigeMult = 1, prestigeLevel = 0;
let laxUsed = false, sortMode = 'default';
let splashes = [], cheatActive = false, cheatTimer = null;
const clickTimes = [];

const COST_SCALE = 1.15;
const PRESTIGE_UNLOCK = 10000;
const PRESTIGE_COST = 10000;
const PRESTIGE_KEEP = 300;
const LAX_COST = 10000;
const MILESTONES = [25, 50, 75, 100];

const gens = [
  { id:'bean',    emoji:'🫘', name:'Bönglas',      baseCost:10,     basePps:1,    count:0, cost:10 },
  { id:'toilet',  emoji:'🚽', name:'Toalett',      baseCost:100,    basePps:5,    count:0, cost:100 },
  { id:'factory', emoji:'🏭', name:'Skitfabrik',   baseCost:500,    basePps:20,   count:0, cost:500 },
  { id:'enema',   emoji:'💉', name:'Lavemang',     baseCost:2000,   basePps:80,   count:0, cost:2000 },
  { id:'mine',    emoji:'⛏️', name:'Bajsgruva',    baseCost:8000,   basePps:300,  count:0, cost:8000 },
  { id:'fossil',  emoji:'🦕', name:'Bajsfossiler', baseCost:50000,  basePps:1000, count:0, cost:50000 },
  { id:'reactor', emoji:'☢️', name:'Bajsreaktor',  baseCost:250000, basePps:5000, count:0, cost:250000 },
];

const SUFFIXES = ['','k','M','B','T','Q',
  'Aa','Ab','Ac','Ad','Ae','Af','Ag','Ah','Ai','Aj','Ak','Al','Am',
  'An','Ao','Ap','Aq','Ar','As','At','Au','Av','Aw','Ax','Ay','Az',
  'Ba','Bb','Bc','Bd','Be','Bf','Bg','Bh','Bi','Bj','Bk','Bl','Bm',
  'Bn','Bo','Bp','Bq','Br','Bs','Bt','Bu','Bv','Bw','Bx','By','Bz'];

function fmt(n) {
  if (n < 1000) return Math.floor(n) + '';
  const tier = Math.min(Math.floor(Math.log10(Math.abs(n)) / 3), SUFFIXES.length - 1);
  const scaled = n / Math.pow(1000, tier);
  return scaled.toFixed(2) + ' ' + SUFFIXES[tier];
}

function milestoneMultiplier(count) {
  let mult = 1;
  for (const m of MILESTONES) { if (count >= m) mult *= 2; else break; }
  return mult;
}
function effectivePps(g) { return g.basePps * milestoneMultiplier(g.count); }
function nextMilestone(count) { for (const m of MILESTONES) { if (count < m) return m; } return null; }
function totalPps() { return gens.reduce((s, g) => s + g.count * effectivePps(g), 0) * prestigeMult; }

function getSorted() {
  const list = [...gens];
  if (sortMode === 'price') list.sort((a, b) => a.cost - b.cost);
  else if (sortMode === 'expensive') list.sort((a, b) => b.cost - a.cost);
  return list;
}

function renderUpgrades() {
  const container = document.getElementById('upgrades');
  container.innerHTML = '';

  getSorted().forEach(g => {
    const pps = effectivePps(g);
    const mult = milestoneMultiplier(g.count);
    const next = nextMilestone(g.count);
    const multBadge = mult > 1 ? `<span class="milestone-badge">x${mult}</span>` : '';
    const nextHint = next
      ? `<div class="next-hint">${next - g.count} till x${mult * 2}</div>`
      : `<div class="next-hint" style="color:var(--text-success)">max dubblat! ✓</div>`;

    const btn = document.createElement('button');
    btn.className = 'upgrade-btn';
    btn.disabled = score < g.cost;
    btn.innerHTML = `
      <div class="upg-left">
        <div class="upg-name">${g.emoji} ${g.name} ${multBadge}</div>
        <div class="upg-pps">${fmt(pps)} sp/sek</div>
      </div>
      <div class="upg-right">
        ${g.count} st<br>${fmt(g.cost)} sp
        ${nextHint}
      </div>`;
    btn.addEventListener('click', () => {
      if (score < g.cost) return;
      score -= g.cost;
      g.count++;
      g.cost = Math.ceil(g.cost * COST_SCALE);
      updateUI();
    });
    container.appendChild(btn);
  });

  const lax = document.createElement('button');
  lax.className = 'upgrade-btn powerup-btn' + (laxUsed ? ' used' : '');
  lax.disabled = laxUsed || score < LAX_COST;
  lax.innerHTML = `
    <div class="upg-left">
      <div class="upg-name">💊 Laxermedel</div>
      <div class="upg-pps">Engång per runda</div>
    </div>
    <div class="upg-right">${laxUsed ? 'redan använt' : '5x poäng<br>' + fmt(LAX_COST) + ' sp'}</div>`;
  if (!laxUsed) {
    lax.addEventListener('click', () => {
      if (laxUsed || score < LAX_COST) return;
      const bonus = score * 4;
      score += bonus;
      totalEver += bonus;
      laxUsed = true;
      floatScore(window.innerWidth / 2, 200, bonus);
      updateUI();
    });
  }
  container.appendChild(lax);
}

function updateUI() {
  document.getElementById('score-display').textContent = fmt(score) + ' skitpoäng';
  const p = totalPps();
  document.getElementById('passive-display').textContent = p > 0 ? fmt(p) + ' sp/sek' : '0 sp/sek';
  document.getElementById('prestige-mult').textContent = prestigeLevel + 2;
  if (prestigeLevel > 0) {
    document.getElementById('prestige-display').textContent = `Prestige ${prestigeLevel} — multiplikator x${prestigeMult}`;
  }
  const pb = document.getElementById('prestige-btn');
  pb.style.display = totalEver >= PRESTIGE_UNLOCK ? 'block' : 'none';
  pb.disabled = score < PRESTIGE_COST;
  renderUpgrades();
}

['sort-default', 'sort-price', 'sort-expensive'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    sortMode = id === 'sort-default' ? 'default' : id === 'sort-price' ? 'price' : 'expensive';
    ['sort-default', 'sort-price', 'sort-expensive'].forEach(s =>
      document.getElementById(s).classList.toggle('active', s === id));
    updateUI();
  });
});

function detectCheat() {
  const now = Date.now();
  clickTimes.push(now);
  if (clickTimes.length > 20) clickTimes.shift();
  if (clickTimes.length >= 10) {
    let fast = 0;
    for (let i = clickTimes.length - 1; i >= clickTimes.length - 9; i--) {
      if (clickTimes[i] - clickTimes[i - 1] < 110) fast++;
    }
    if (fast >= 8) triggerCheat();
  }
}

function triggerCheat() {
  if (cheatActive) return;
  cheatActive = true;
  document.getElementById('cheat-box').style.display = 'block';
  clearSplashes();
  [[10,10],[80,10],[10,40],[80,40],[45,25],[20,70],[70,70],[50,55],[30,15],[65,30]].forEach(([l, t]) => {
    const el = document.createElement('div');
    el.className = 'skit-splash';
    el.textContent = '💩';
    el.style.left = l + '%';
    el.style.top = t + '%';
    el.style.fontSize = (18 + Math.random() * 24) + 'px';
    document.body.appendChild(el);
    splashes.push(el);
  });
  if (cheatTimer) clearTimeout(cheatTimer);
  cheatTimer = setTimeout(() => {
    cheatActive = false;
    document.getElementById('cheat-box').style.display = 'none';
    clearSplashes();
  }, 4000);
}

function clearSplashes() { splashes.forEach(e => e.remove()); splashes = []; }

function floatScore(x, y, val) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = '+' + fmt(val);
  el.style.left = (x - 20) + 'px';
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// =====================================================
// SPARA & LADDA — localStorage
// =====================================================
const SAVE_KEY = 'poop_clicker_save';

function saveGame() {
  const data = {
    score,
    totalEver,
    prestigeMult,
    prestigeLevel,
    laxUsed,
    gens: gens.map(g => ({ id: g.id, count: g.count, cost: g.cost }))
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    score        = data.score        || 0;
    totalEver    = data.totalEver    || 0;
    prestigeMult = data.prestigeMult || 1;
    prestigeLevel= data.prestigeLevel|| 0;
    laxUsed      = data.laxUsed      || false;
    if (data.gens) {
      data.gens.forEach(saved => {
        const g = gens.find(x => x.id === saved.id);
        if (g) { g.count = saved.count; g.cost = saved.cost; }
      });
    }
  } catch (e) {
    console.warn('Kunde inte ladda sparfil:', e);
  }
}

// Spara var 10:e sekund och när sidan stängs
setInterval(saveGame, 10000);
window.addEventListener('beforeunload', saveGame);

// Ladda sparad data direkt
loadGame();

document.getElementById('poop-btn').addEventListener('click', (e) => {
  detectCheat();
  const gain = 1 * prestigeMult;
  score += gain;
  totalEver += gain;
  floatScore(e.clientX, e.clientY, gain);
  updateUI();
});

document.getElementById('prestige-btn').addEventListener('click', () => {
  if (score < PRESTIGE_COST) return;
  prestigeLevel++;
  prestigeMult = prestigeLevel + 1;
  score = PRESTIGE_KEEP;
  totalEver = 0;
  laxUsed = false;
  gens.forEach(g => { g.count = 0; g.cost = g.baseCost; });
  clickTimes.length = 0;
  cheatActive = false;
  document.getElementById('cheat-box').style.display = 'none';
  clearSplashes();
  saveGame();
  updateUI();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Är du säker? All progress raderas permanent.')) return;
  localStorage.removeItem(SAVE_KEY);
  score=0; totalEver=0; prestigeMult=1; prestigeLevel=0; laxUsed=false;
  gens.forEach(g => { g.count=0; g.cost=g.baseCost; });
  updateUI();
});

setInterval(() => {
  const p = totalPps();
  if (p > 0) { score += p / 10; totalEver += p / 10; updateUI(); }
}, 100);

updateUI();
</script>
</body>
</html>
